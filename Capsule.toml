[package]
name = "astrid-capsule-cli"
version = "0.1.0"
description = "Native Unix Socket bridge for the Astrid CLI frontend."

[[component]]
id = "main"
file = "astrid_capsule_cli.wasm"

[capabilities]
uplink = true
net_bind = ["unix:*"]
ipc_publish = [
    "user.v1.prompt",
    "client.v1.connect",
    "client.v1.disconnect",
    "cli.v1.command.execute",
    "astrid.v1.request.*",
    # KernelClient adds a correlation UUID suffix to its request
    # topics (astrid.v1.request.<verb>.<uuid>) so concurrent in-flight
    # calls each get a private response channel. Without the 5-seg
    # pattern below, every gateway-side KernelRequest (e.g. /api/capsules)
    # — and every CLI command going through KernelClient (astrid who,
    # astrid daemon status, astrid ps) — is denied at publish time.
    "astrid.v1.request.*.*",
    # Admin topics under astrid.v1.admin.<group>.<verb>[.<sub>] — host
    # publish cap-check uses strict segment-count matching, so list
    # each depth (5-seg covers invite/agent/group/quota/caps, 6-seg
    # covers auth.pair.*).
    "astrid.v1.admin.*.*",
    "astrid.v1.admin.*.*.*",
    "astrid.v1.elicit.response.*",
    "astrid.v1.approval.response.*",
    "registry.v1.get_providers",
    "registry.v1.set_active_model",
    "registry.v1.selection.*",
    "session.v1.request.*",
]
ipc_subscribe = [
    "agent.v1.response",
    "agent.v1.stream.delta",
    "astrid.v1.approval",
    "astrid.v1.capsules_loaded",
    "astrid.v1.elicit.*",
    "astrid.v1.onboarding.required",
    "astrid.v1.response.*",
    # Admin response topics are astrid.v1.admin.response.<group>.<verb>[.<sub>].
    # Strict segment-count matching means a single `*` matches one segment, so
    # the deeper patterns are needed or multi-segment admin responses never
    # reach the proxy and CLI admin calls time out. Mirrors the ipc_publish
    # depth enumeration (astrid.v1.admin.*.* / *.*.*).
    "astrid.v1.admin.response.*",
    "astrid.v1.admin.response.*.*",
    "astrid.v1.admin.response.*.*.*",
    "registry.v1.response.*",
    "registry.v1.active_model_changed",
    "registry.v1.selection.*",
    "session.v1.response.*",
]
